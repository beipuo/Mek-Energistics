name: Publish to CurseForge

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version name to publish when running manually
        required: true
        default: manual-build
        type: string
      version_type:
        description: CurseForge release type
        required: true
        default: release
        type: choice
        options:
          - release
          - beta
          - alpha
      changelog:
        description: Changelog text to use when running manually
        required: true
        default: Manual CurseForge upload.
        type: string

jobs:
  # P2-9: GameTest gate. Mirrors the GameTest job in build.yml because GitHub Actions
  # needs cannot reference a job in another workflow; publishing only proceeds after
  # the game test matrix passes.
  gametest:
    name: GameTest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-home-cache-cleanup: true

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run tests and GameTest server
        timeout-minutes: 20
        run: ./gradlew test runGameTestServer --no-daemon

  publish:
    runs-on: ubuntu-latest
    needs: gametest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      # P2-9: hard gate before publishing - refuse to publish unless build.gradle pins
      # both optional runtime mods the release matrix depends on.
      - name: Verify required dependency pins in build.gradle
        run: |
          grep -q 'data-energistics-1565514:9095664' build.gradle || { echo "::error::build.gradle is missing the data-energistics-1565514:9095664 pin"; exit 1; }
          grep -q 'mekanism-more-machine-1275257:8659501' build.gradle || { echo "::error::build.gradle is missing the mekanism-more-machine-1275257:8659501 pin"; exit 1; }

      - name: Publish to CurseForge
        uses: Kira-NT/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: |
            build/libs/!(*-@(dev|sources|javadoc)).jar

          name: Mek Energistics ${{ github.event.release.tag_name || github.event.inputs.version }}
          version: ${{ github.event.release.tag_name || github.event.inputs.version }}
          version-type: ${{ github.event.inputs.version_type || 'release' }}
          changelog: ${{ github.event.release.body || github.event.inputs.changelog }}

          dependencies: |
            curseforge:223794(required)
            curseforge:268560(required)
            curseforge:574300(required)

          loaders: |
            neoforge
          game-versions: |
            1.21.1
          java: |
            21
