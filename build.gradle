plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets {
    optionalApi

    main {
        compileClasspath += optionalApi.output
    }
    test {
        compileClasspath += optionalApi.output
        runtimeClasspath += optionalApi.output
    }
}

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("**/.cache/**") // datagen cache files
}

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

sourceSets {
    gameTest {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += output + compileClasspath + main.runtimeClasspath
    }
}

repositories {
    maven {
        name = "Modmaven"
        url = uri("https://modmaven.dev/")
    }
    maven {
        name = "CurseMaven"
        url = uri("https://cursemaven.com")
    }
    maven {
        name = "Modrinth"
        url = uri("https://api.modrinth.com/maven")
    }
    maven {
        name = "IllusiveC4"
        url = uri("https://maven.theillusivec4.top/")
    }
    mavenCentral()
}

base {
    archivesName = mod_id
}

def debugRuns = providers.gradleProperty('mekenergistics.debugRuns')
        .map { it.toBoolean() }
        .orElse(false)

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')
    addModdingDependenciesTo(sourceSets.gameTest)

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gameTest
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Use -Pmekenergistics.debugRuns=true to enable registry markers and DEBUG logging.
            if (debugRuns.get()) {
                systemProperty 'forge.logging.markers', 'REGISTRIES'
                logLevel = org.slf4j.event.Level.DEBUG
            } else {
                logLevel = org.slf4j.event.Level.INFO
            }
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gameTest)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    gameTestRuntimeClasspath.extendsFrom localRuntime
    optionalApiCompileOnly.extendsFrom implementation, compileOnly
}

// CurseMaven coordinates are "<slug>-<projectId>:<fileId>" and carry no version, so each is
// annotated with the mod id and version that file actually resolves to. Update the comment whenever
// you bump a file id -- there is no other way to tell what a build compiles against.
dependencies {
    implementation "curse.maven:applied-energistics-2-223794:7027323"
    implementation "curse.maven:mekanism-268560:7904058"                // mekanism 10.7.19
    implementation "curse.maven:applied-mekanistics-574300:7096962"     // appmek 1.6.3
    // Unpublished optional-mod API contracts live in sourceSets.optionalApi. They are available to
    // compilation and tests, but are deliberately excluded from the generated Mek-Energistics jar.
    testImplementation platform("org.junit:junit-bom:5.10.3")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    // Reads our own bytecode to enforce the optional-mod boundary. It resolves references from the
    // constant pool, so the optional mods being absent at test runtime does not weaken the rules.
    testImplementation "com.tngtech.archunit:archunit-junit5:1.3.0"

    compileOnly "curse.maven:jei-238222:8807104"                        // jei, Magic requires >=19.39.0
    compileOnly "curse.maven:iglee-library-541199:7000755"              // igleelib 1.21.1-1.2.7
    compileOnly "curse.maven:evolved-mekanism-1230085:7599592"          // evolvedmekanism 1.2.1-fix3
    compileOnly "curse.maven:evolved-mekanism-extras-1268159:8678947"   // emextras 1.2.2
    compileOnly "curse.maven:mekanism-extras-1026040:8677677"           // mekanism_extras 1.4.1
    compileOnly "curse.maven:mekanism-more-machine-1275257:8659501"     // mekmm 1.4.0, also ships the meklm large machines
    compileOnly "curse.maven:jade-324717:7545219"                       // jade 15.10.5+neoforge
    compileOnly "curse.maven:glodium-957920:5821676"                    // glodium 1.21-2.2-neoforge
    compileOnly "curse.maven:applied-flux-965012:7429565"               // appflux 1.21-2.1.4-neoforge
    // "ex-pattern-provider" is ExtendedAE under its former project name. This is what lets
    // mixin/extendedae/ContainerRenamerMixin compile; nothing else here advertises the connection.
    compileOnly "curse.maven:ex-pattern-provider-892005:8025439"        // extendedae 1.21-2.2.32-neoforge
    compileOnly "curse.maven:thunderbolt-core-1631756:8580186"          // Thunderbolt Core, batch-provider API
    compileOnly "curse.maven:mekanism-magic-1660500:8697428"            // mekanism_magic, IMekanismMagicAutomation host
    compileOnly "curse.maven:omnisequence-transfinite-1624558:8622739"    // OmniSequence Transfinite 1.21.1 NeoForge, parent build verified
    compileOnly "curse.maven:data-energistics-1565514:8841396"          // DataEnergistics 3.0.4, counted-crafting ABI

    localRuntime "curse.maven:guideme-1173950:8420861"                  // GuideME 21.1.x, local test runtime
    localRuntime "curse.maven:kotlin-for-forge-351264:8335665"          // Kotlin for Forge, bundles Kotlin 2.4.0
    localRuntime "curse.maven:mekanism-generators-268566:7904061"       // mekanismgenerators 10.7.19
    localRuntime "curse.maven:jei-238222:8807104"                       // jei, Magic requires >=19.39.0
    localRuntime "curse.maven:ae2-jei-integration-1074338:7727898"      // ae2jeiintegration 1.2.1
    localRuntime "curse.maven:iglee-library-541199:7000755"             // igleelib 1.21.1-1.2.7
    localRuntime "curse.maven:evolved-mekanism-1230085:7599592"         // evolvedmekanism 1.2.1-fix3
    localRuntime "curse.maven:evolved-mekanism-extras-1268159:8678947"  // emextras 1.2.2
    localRuntime "curse.maven:mekanism-extras-1026040:8677677"          // mekanism_extras 1.4.1
    localRuntime "curse.maven:mekanism-more-machine-1275257:8659501"    // mekmm 1.4.0
    localRuntime "curse.maven:productivebees-377897:8022994"            // productivebees 1.21.1-13.13.5
    localRuntime "curse.maven:jade-324717:7545219"                      // jade 15.10.5+neoforge
    localRuntime "curse.maven:building-gadgets-298187:6850515"          // buildinggadgets2 1.3.9
    // localRuntime "curse.maven:mekanism-unleashed-1072209:7801278"    // mekanism_unleashed 1.21.1-0.3.4
    localRuntime "curse.maven:advancedae-1084104:7849217"               // advanced_ae 1.6.11-1.21.1
    localRuntime "curse.maven:omni-cells-1359517:8050965"               // ae2omnicells 1.1.6
    localRuntime "curse.maven:omnisequence-transfinite-1624558:8622739"  // OmniSequence Transfinite 1.21.1 NeoForge, parent build verified
    localRuntime "curse.maven:geckolib-388172:7707149"                  // geckolib 4.8.4
    localRuntime "curse.maven:glodium-957920:5821676"                   // glodium 1.21-2.2-neoforge
    localRuntime "curse.maven:applied-flux-965012:8204513"              // appflux 1.21-2.1.5-neoforge
    localRuntime "curse.maven:ex-pattern-provider-892005:8025439"       // extendedae 1.21-2.2.32-neoforge
    localRuntime "curse.maven:extendedae-plus-1337639:8379620"          // extendedae_plus 1.21.1-1.5.4.1
    localRuntime "curse.maven:ae2-lightning-tech-1527395:8575479"       // AE2 Lightning Tech, local compatibility runtime
    localRuntime "curse.maven:thunderbolt-core-1631756:8580186"         // Thunderbolt Core, local compatibility runtime
    localRuntime "curse.maven:ldlib-626676:8940836"                     // ldlib, local test runtime for DataEnergistics/NeoECOAE
    localRuntime "curse.maven:data-energistics-1565514:8841396"          // DataEnergistics 3.0.4
    localRuntime "curse.maven:mekanism-card-1495058:8498626"
    localRuntime "curse.maven:mekanism-magic-1660500:8697428"           // mekanism_magic, local compatibility runtime
    localRuntime "curse.maven:occultism-361026:8592809"                 // occultism 1.224.2, Magic content host
    // Occultism required runtime deps (geckolib already present above).
    localRuntime "maven.modrinth:modonomicon:1.21.1-1.120.4"            // modonomicon >=1.117.2
    localRuntime "curse.maven:curios-309927:6529130"                    // curios 9.5.1+1.21.1
    localRuntime "curse.maven:smartbrainlib-661293:5513418"             // smartbrainlib 1.14.5
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
